name: Build Xeno OS Kernel

on:
  push:
    paths:
      - 'kernel/patches/**'
      - 'kernel/configs/**'
      - 'kernel/build-kernel.sh'
      - 'kernel/validate-kernel-deb.sh'
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'

permissions:
  contents: write

jobs:
  compile_kernel:
    name: Compile Kernel Packages
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      run_number: ${{ github.run_number }}

    steps:
      - name: Free Disk Space (Maximize Storage)
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo apt-get clean
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential gcc g++ make \
            libssl-dev libelf-dev libncurses-dev libdw-dev \
            flex bison bc cpio rsync kmod \
            dwarves pahole \
            xz-utils zstd wget \
            debhelper dpkg-dev

      - name: Build Xeno OS kernel
        run: |
          chmod +x kernel/build-kernel.sh kernel/validate-kernel-deb.sh
          bash kernel/build-kernel.sh

      - name: Upload kernel packages to artifact store
        uses: actions/upload-artifact@v4
        with:
          name: xeno-kernel-debs
          path: kernel/output/*.deb
          retention-days: 3

  publish_release:
    name: Publish GitHub Release
    needs: compile_kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download kernel packages from compilation job
        uses: actions/download-artifact@v4
        with:
          name: xeno-kernel-debs
          path: ./kernel-debs

      - name: Validate downloaded debs
        run: |
          chmod +x kernel/validate-kernel-deb.sh
          bash kernel/validate-kernel-deb.sh ./kernel-debs

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-${{ needs.compile_kernel.outputs.run_number }}
          name: "Xeno OS Kernel Build ${{ needs.compile_kernel.outputs.run_number }}"
          files: ./kernel-debs/*.deb
          body: |
            Xeno OS custom XanMod kernel with:
            - Full CONFIG_WLAN + major in-tree Wi-Fi drivers
            - Kali-oriented mac80211 / cfg80211 injection patches
            - PREEMPT + 1000Hz + NTSYNC (Windows app smoothness)

            Install:
            ```
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb
            sudo update-initramfs -u
            ```

            Validate before shipping:
            ```
            bash kernel/validate-kernel-deb.sh .
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
