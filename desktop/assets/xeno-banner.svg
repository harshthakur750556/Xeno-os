<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#161824"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF; #7000FF; #00FFA3; #00F0FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7000FF">
        <animate attributeName="stop-color" values="#7000FF; #00FFA3; #00F0FF; #7000FF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#bc13fe" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%; 100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%; 200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#222533" stroke-width="1.5"/>

  <g stroke="#1a1d2d" stroke-width="1" opacity="0.6">
    <line x1="40" y1="0" x2="40" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="220"/>
    <line x1="200" y1="0" x2="200" y2="220"/>
    <line x1="280" y1="0" x2="280" y2="220"/>
    <line x1="360" y1="0" x2="360" y2="220"/>
    <line x1="440" y1="0" x2="440" y2="220"/>
    <line x1="520" y1="0" x2="520" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="680" y1="0" x2="680" y2="220"/>
    <line x1="760" y1="0" x2="760" y2="220"/>
    <line x1="840" y1="0" x2="840" y2="220"/>
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
  </g>

  <g fill="#00F0FF" opacity="0.7">
    <circle cx="120" cy="40" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="120" r="3.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="80" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="160" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="0" width="900" height="2.5" fill="url(#laserBeam)" />
  <rect x="0" y="217.5" width="900" height="2.5" fill="url(#laserBeam)" />

  <g transform="translate(50, 42)">
    <rect width="180" height="26" rx="13" fill="#161821" stroke="#00F0FF" stroke-width="1" opacity="0.9"/>
    <circle cx="14" cy="13" r="4.5" fill="#00FFA3">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="11" font-weight="700" letter-spacing="1.5">v9.0-BETA NOBLE</text>
  </g>

  <g transform="translate(240, 42)">
    <rect width="170" height="26" rx="13" fill="#161821" stroke="#7000FF" stroke-width="1" opacity="0.9"/>
    <circle cx="14" cy="13" r="4.5" fill="#bc13fe"/>
    <text x="26" y="17" fill="#eceff4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1">XANMOD 6.12+ BORE</text>
  </g>

  <g transform="translate(50, 125)">
    <text x="0" y="0" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="50" font-weight="900" letter-spacing="6" filter="url(#glow)" opacity="0.6">XENO OS</text>
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="50" font-weight="900" letter-spacing="6">XENO OS</text>
  </g>

  <text x="52" y="158" fill="#88c0d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="13" font-weight="600" letter-spacing="2.5">NEXT-GEN HYBRID SECURITY &amp; PURE TYPESCRIPT WAYLAND PLATFORM</text>

  <g transform="translate(50, 178)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="10.5" font-weight="600">
    <text x="0" y="14" fill="#a0a8b6">KALI PACKET INJECTION</text>
    <text x="180" y="14" fill="#5e657a">|</text>
    <text x="195" y="14" fill="#a0a8b6">ASTAL v2 BUN SHELL</text>
    <text x="350" y="14" fill="#5e657a">|</text>
    <text x="365" y="14" fill="#a0a8b6">UNIVERSAL EXECUTION</text>
    <text x="530" y="14" fill="#5e657a">|</text>
    <text x="545" y="14" fill="#a0a8b6">KMS SWRAST VM GRAPHICS</text>
  </g>

  <g transform="translate(760, 110)">
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#161821" stroke="#bc13fe" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="6" fill="#00FFA3">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>